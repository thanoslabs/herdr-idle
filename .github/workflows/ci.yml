name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          # Fail if an env file or a private key is committed (by file name, not content).
          found="$(git ls-files | grep -E '(^|/)\.env(\..*)?$|\.(pem|key)$' || true)"
          if [ -n "$found" ]; then
            echo "Error: sensitive files committed:"
            echo "$found"
            exit 1
          fi

      - name: Check for stray pictures
        run: |
          # Pictures live in a mod's art/ folder, or are the layout's preview.png
          # or battle.gif: anywhere else is a generator run into the wrong folder.
          found="$(git ls-files '*.png' '*.gif' | grep -v -E '^(mods/[^/]+/art/|preview\.png$|battle\.gif$)' || true)"
          if [ -n "$found" ]; then
            echo "Error: pictures outside a mod's art folder:"
            echo "$found" | head -20
            exit 1
          fi

      - name: Check the recipe's size
        run: |
          # Herdr's gallery drops a layout's whole listing when its RECIPE.md is
          # over 64 KB. Fail well before that, leaving room to grow.
          limit=60000
          size="$(wc -c < RECIPE.md | tr -d ' ')"
          if [ "$size" -gt "$limit" ]; then
            echo "Error: RECIPE.md is $size bytes, over $limit. Herdr's gallery drops the layout's listing past 64 KB: tighten the recipe (state each fact once, tables for runs of numbers) before adding to it."
            exit 1
          fi
          echo "RECIPE.md: $size bytes (limit $limit)"

      - name: Validate YAML and JSON files
        run: |
          status=0
          for f in $(git ls-files '*.yaml' '*.yml'); do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" || { echo "Invalid YAML: $f"; status=1; }
          done
          for f in $(git ls-files '*.json'); do
            python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f" || { echo "Invalid JSON: $f"; status=1; }
          done
          exit $status

      - name: Check scripts
        run: |
          sh -n install.sh
          python3 -m py_compile tools/*.py
          for f in mods/*/*.js; do
            node --input-type=module --check < "$f" || { echo "Syntax error: $f"; exit 1; }
          done

      - name: Check the art
        run: |
          # art/ holds exactly the files the generator writes, by path (folders and
          # all), and nothing else: no stray file, folder entry or link
          out="$(mktemp -d)"
          python3 tools/idle-rpg-sprites.py "$out" > /dev/null
          diff <(cd "$out" && find . ! -type d | LC_ALL=C sort) <(cd mods/idle-rpg/art && find . ! -type d | LC_ALL=C sort) \
            || { echo "art/ and the generator disagree: regenerate it"; exit 1; }
          diff <(cd "$out" && find . -type d | LC_ALL=C sort) <(cd mods/idle-rpg/art && find . -type d | LC_ALL=C sort) \
            || { echo "art/ has folders the generator does not write"; exit 1; }
          # and every picture the rules can ask for is there: each class in each
          # colourway, each weapon's layer for its class in every picture it has
          # and its attack's pictures facing each way, each hat's overlay for each
          # class (no hat, no overlay), every monster's pictures (its attacks on the party too) and every character
          # of the pixel font in every colour it has (and no other colour), every
          # biome's backdrop and swatch, every season's decorations, every
          # character of the lettering likewise (the placeholder and the ellipsis
          # included) and every label the HUD letters, the boss's names, and that
          # any name a tag shows letters to those characters only, the
          # weapon effects' icons, marks and pictures on the boss (effects.js);
          # plus every picture main.js names outright
          node --input-type=module <<'EOF'
          import { existsSync, readdirSync, readFileSync } from "node:fs";
          import { EFFECT_ICONS, EFFECT_MARKS, EFFECT_OVERLAYS, effectIconArt, markArt, overlayArt } from "./mods/idle-rpg/effects.js";
          import { ATTACK_PARTS, BIOMES, BIOME_ART, CLASSES, SEASONS, SEASON_ART, ELLIPSIS, FRAMES, GLYPHS, GLYPH_COLOURS, KINDS, LABELS, LETTERS, LETTER_COLOURS, MONSTER_ART, MONSTER_ATTACKS, UNKNOWN, WEAPON_FRAMES, attackArt, attackPart, biomeArt, catalogue, clockText, glyphArt, hatArt, letterArt, letterFit, letterable, lookArt, monsterArt, seasonArt, shortNumber, weaponArt } from "./mods/idle-rpg/rules.js";
          const dir = "mods/idle-rpg";
          const unknown = KINDS.filter((k) => !MONSTER_ART[k]);
          if (unknown.length) {
            console.error(`Kinds with no MONSTER_ART: ${unknown.join(", ")}`);
            process.exit(1);
          }
          // every character a number can be written with (damage, HP: shortNumber,
          // and "!" and "+" after or before one) is in the pixel font
          const written = new Set("!+");
          for (let n = 0; n < 1e80; n = n * 1.37 + 1) for (const ch of shortNumber(n)) written.add(ch);
          const unwritable = [...written].filter((ch) => !GLYPHS.includes(ch));
          if (unwritable.length) {
            console.error(`Characters numbers are written with that the pixel font lacks: ${unwritable.join(" ")}`);
            process.exit(1);
          }
          // the font's colours are GLYPH_COLOURS, no more and no fewer, and every
          // colour main.js sets text in is one: each quoted word among a
          // pixelText call's arguments ("white", or either side of a ternary,
          // d.crit ? "gold" : "white") and the values of DOT_COLOURS
          const fonts = readdirSync(`${dir}/art/font`).sort();
          if (fonts.join() !== [...GLYPH_COLOURS].sort().join()) {
            console.error(`art/font has ${fonts.join(", ")}; GLYPH_COLOURS is ${GLYPH_COLOURS.join(", ")}`);
            process.exit(1);
          }
          const source = readFileSync(`${dir}/main.js`, "utf8");
          const dots = source.match(/const DOT_COLOURS = \{([^}]*)\}/)?.[1] ?? "";
          const calls = [...source.matchAll(/pixelText\(((?:[^()]|\([^()]*\))*)\)/g)].map((m) => m[1]).filter((args) => !args.startsWith("text, colour"));
          if (calls.length < 3) {
            console.error(`Expected main.js to set pixel text in several places, found ${calls.length}`);
            process.exit(1);
          }
          const colours = [...calls.flatMap((args) => [...args.matchAll(/"([a-z]+)"/g)]), ...dots.matchAll(/"([a-z]+)"/g)].map((m) => m[1]);
          const uncoloured = colours.filter((c) => !GLYPH_COLOURS.includes(c));
          if (!dots || uncoloured.length) {
            console.error(`Text colours the pixel font lacks: ${uncoloured.join(", ") || "(no DOT_COLOURS in main.js)"}`);
            process.exit(1);
          }
          // the lettering (the HUD's words) likewise: its colours are
          // LETTER_COLOURS, and every colour a letterText call or a note or
          // button in main.js sets it in is one ("text: ..." and "colour: ...")
          const letterings = readdirSync(`${dir}/art/lettering`).sort();
          if (letterings.join() !== [...LETTER_COLOURS].sort().join()) {
            console.error(`art/lettering has ${letterings.join(", ")}; LETTER_COLOURS is ${LETTER_COLOURS.join(", ")}`);
            process.exit(1);
          }
          const lettered = [...source.matchAll(/letterText\(((?:[^()]|\([^()]*\))*)\)/g)].map((m) => m[1]).filter((args) => !args.startsWith("text, colour"));
          // the words come only from LABELS in rules.js: no letterText call is given a quoted string
          const quoted = lettered.filter((args) => /^\s*["'`]/.test(args));
          if (quoted.length) {
            console.error(`letterText given words not in LABELS (rules.js): ${quoted.join(" | ")}`);
            process.exit(1);
          }
          const letterColours = [...lettered.flatMap((args) => [...args.matchAll(/"([a-z]+)"/g)]), ...source.matchAll(/\b(?:text|colour): "([a-z]+)"/g)].map((m) => m[1]);
          const unlettered = letterColours.filter((c) => !LETTER_COLOURS.includes(c));
          if (lettered.length < 3 || unlettered.length) {
            console.error(`Lettering colours it lacks: ${unlettered.join(", ") || `(only ${lettered.length} letterText calls)`}`);
            process.exit(1);
          }
          // and every label main.js letters can be drawn whole: the numbers beside the
          // words are shortNumber's and clockText's, and each label is tried with every digit
          const samples = ["0123456789", "999"];
          const labels = Object.values(LABELS).flatMap((l) => (typeof l === "function" ? samples.flatMap((n) => [l(n, n), l(LABELS.timesUp, n)]) : [l]));
          for (let n = 0; n < 1e80; n = n * 1.37 + 1) labels.push(shortNumber(n));
          for (let ms = 0; ms <= 3600000; ms += 997) labels.push(clockText(ms));
          // the boss's names on its plate (MONSTERS in main.js) too
          const bosses = [...readFileSync(`${dir}/main.js`, "utf8").matchAll(/^\s+[a-z]+: \{ name: "([^"]+)"/gm)].map((m) => m[1]);
          if (bosses.length < KINDS.length) {
            console.error(`Expected a name for each of ${KINDS.join(", ")} in MONSTERS (main.js), found ${bosses.join(", ")}`);
            process.exit(1);
          }
          labels.push(...bosses, ...bosses.map((b) => LABELS.slain(b)));
          const unletterable = [...new Set(labels.filter((t) => !letterable(t)))];
          if (unletterable.length) {
            console.error(`Labels the lettering cannot draw: ${unletterable.join(" | ")}`);
            process.exit(1);
          }
          // names (an agent's tag) are any text: letterFit gives only characters of the
          // face, the placeholder for what it lacks and the ellipsis where it cuts one
          // (both in LETTERS, so drawn in every colour below), and each character's
          // picture has a name of its own in plain letters and digits
          if (!LETTERS.includes(UNKNOWN) || !LETTERS.includes(ELLIPSIS)) {
            console.error("LETTERS lacks the placeholder (UNKNOWN) or the ellipsis");
            process.exit(1);
          }
          const names = [...LETTERS].filter((ch) => ch !== " ").map((ch) => letterArt("white", ch));
          if (new Set(names).size !== names.length || names.some((n) => !/^lettering\/white\/[a-z0-9]+\.png$/.test(n ?? ""))) {
            console.error(`Lettering pictures not named one each in [a-z0-9]: ${names.join(" ")}`);
            process.exit(1);
          }
          const odd = ["caf\u00e9 \u65e5\u672c \u{1F680}\u200d\u{1F525}", "../../etc/passwd", "__proto__", "a\u0301\u0302", "\ud800", "x".repeat(10000)];
          for (let cp = 0; cp < 0x30000; cp += 13) if (cp < 0xd800 || cp >= 0xe000) odd.push(String.fromCodePoint(cp));
          const strays = odd.flatMap((t) => [...letterFit(t), ...letterFit(t, 38)]).filter((ch) => !LETTERS.includes(ch));
          if (strays.length || !letterFit("\u65e5").includes(UNKNOWN) || !letterFit("x".repeat(99), 38).endsWith(ELLIPSIS)) {
            console.error(`letterFit gave characters outside LETTERS (${[...new Set(strays)].join(" ")}), or no placeholder or ellipsis`);
            process.exit(1);
          }
          const paths = [
            ...LETTER_COLOURS.flatMap((c) => [...LETTERS].filter((ch) => ch !== " ").map((ch) => letterArt(c, ch))),
            ...EFFECT_ICONS.map(effectIconArt),
            ...EFFECT_MARKS.map(markArt),
            ...Object.entries(EFFECT_OVERLAYS).flatMap(([status, parts]) => parts.map((part) => overlayArt(status, part))),
            ...CLASSES.flatMap((c) => [
              ...catalogue(c, "armour").flatMap((it) => FRAMES.map((f) => lookArt(c, it.id, f))),
              // a weapon's own pictures (never its class's default standing in for it), and
              // its attack's (the warrior's slash is its own hit, so it has no "hit")
              ...catalogue(c, "weapon").flatMap((it) => [
                ...WEAPON_FRAMES[c].map((f) => (weaponArt(c, it.id, f)?.startsWith(`weapons/${c}/${it.id}/`) ? weaponArt(c, it.id, f) : null)),
                ...ATTACK_PARTS.flatMap((part) => (c === "warrior" && part === "hit" ? [] : ["l", "r"].map((side) => attackArt(c, it.id, part, side)))),
              ]),
              ...catalogue(c, "hat").flatMap((it) => (hatArt(c, it.id) ? FRAMES.map((f) => hatArt(c, it.id, f)) : [])),
            ]),
            ...KINDS.flatMap((k) => MONSTER_ART[k].map((part) => monsterArt(k, part))),
            // every piece of each kind's two attacks on the party (monsters fighting back), to either side
            ...KINDS.flatMap((k) => ["single", "area"].flatMap((type) => Object.entries(MONSTER_ATTACKS[k]?.[type] ?? {}).filter(([, part]) => part).flatMap(([piece]) =>
              ["l", "r"].map((side) => (attackPart(k, type, piece, side) === null ? "attack piece without a part" : monsterArt(k, attackPart(k, type, piece, side))))))),
            ...GLYPH_COLOURS.flatMap((c) => [...GLYPHS].map((ch) => glyphArt(c, ch))),
            // every biome's backdrop (the raids' scenes) and its swatch in the stage picker
            ...BIOMES.flatMap((b) => (BIOME_ART[b.id] ?? ["a biome with no BIOME_ART"]).map((part) => biomeArt(b.id, part))),
            // every season's decorations in town and its pictures of the night (seasons/<id>/)
            ...SEASONS.flatMap((s) => (SEASON_ART[s.id] ?? ["a season with no SEASON_ART"]).map((part) => seasonArt(s.id, part))),
            // the quoted "<folder>/<name>.png" paths in main.js (src("scene/wall.png") and so on)
            ...[...readFileSync(`${dir}/main.js`, "utf8").matchAll(/"([a-z0-9-]+(?:\/[a-z0-9-]+)+\.png)"/g)].map((m) => m[1]),
          ];
          const main = readFileSync(`${dir}/main.js`, "utf8");
          // a monster's part named in main.js (layer("top"), monsterArt(kind, "roar/wave")) is one some kind has
          const parts = new Set(Object.values(MONSTER_ART).flat());
          const strange = [...main.matchAll(/(?:layer\(|monsterArt\([^,()]+,\s*)"([^"]+)"/g)].map((m) => m[1]).filter((part) => !parts.has(part));
          if (strange.length) {
            console.error(`Monster parts no kind has: ${strange.join(", ")}`);
            process.exit(1);
          }
          // and a path main.js builds (`light/${art}.png`) starts in a folder that is there
          const built = [...main.matchAll(/`([a-z0-9-]+(?:\/[a-z0-9-]+)*)\/[^`/]*\$\{[^`]*\.png`/g)].map((m) => m[1]);
          const lost = built.filter((folder) => !existsSync(`${dir}/art/${folder}`));
          if (lost.length) {
            console.error(`Paths built in folders art/ does not have: ${lost.join(", ")}`);
            process.exit(1);
          }
          const missing = paths.filter((p) => typeof p !== "string" || !existsSync(`${dir}/art/${p}`));
          if (missing.length) {
            console.error(`Missing art:\n${missing.join("\n")}`);
            process.exit(1);
          }
          console.log(`${new Set(paths).size} picture paths, ${built.length} built paths' folders checked`);
          EOF

      - name: Install into an empty Herdr home
        run: |
          home="$(mktemp -d)"
          HERDR_APP_HOME="$home" ./install.sh idle-rpg   # the name it used to take is still accepted
          test -f "$home/layouts/idle-rpg.json"
          test -f "$home/mods/idle-rpg/main.js"
          test -f "$home/mods/idle-rpg/rules.js"
          test -f "$home/mods/idle-rpg/effects.js"
          test -f "$home/mods/idle-rpg/art/scene/wall.png"
          diff -r mods/idle-rpg/art "$home/mods/idle-rpg/art"

      - name: Upgrade an install with stale art
        run: |
          # an older install: flat art files, a file Herdr wrote, and art/ holding a
          # link to something outside the mod, which must survive
          home="$(mktemp -d)"
          outside="$(mktemp -d)"
          touch "$outside/keep.png"
          mkdir -p "$home/mods/idle-rpg/art"
          touch "$home/mods/idle-rpg/art/wizard.png" "$home/mods/idle-rpg/art/glyph-white-1.png" "$home/mods/idle-rpg/jsconfig.json"
          ln -s "$outside" "$home/mods/idle-rpg/art/elsewhere"
          HERDR_APP_HOME="$home" ./install.sh
          diff -r mods/idle-rpg/art "$home/mods/idle-rpg/art"
          test -f "$home/mods/idle-rpg/jsconfig.json"
          test -f "$outside/keep.png"
          # re-running over a symlinked art/ replaces the link, not what it points to
          rm -rf "$home/mods/idle-rpg/art"
          ln -s "$outside" "$home/mods/idle-rpg/art"
          HERDR_APP_HOME="$home" ./install.sh
          test ! -L "$home/mods/idle-rpg/art"
          test -f "$outside/keep.png"
          diff -r mods/idle-rpg/art "$home/mods/idle-rpg/art"

      - name: Run the tests
        run: |
          # Node's built-in runner, no dependencies (tests/README.md). The runner's
          # Node must be 22 or later (.tool-versions pins the version used locally).
          node -e 'const [major] = process.versions.node.split("."); if (+major < 22) { console.error(`Node ${process.version}: the tests need 22 or later`); process.exit(1); }'
          tap="$(mktemp)"
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination="$tap" 'tests/**/*.test.mjs'
          # a known bug's todo test that now passes: the bug is fixed, so drop the todo (a warning, not a failure)
          grep -E '^ *ok [0-9]+ - .* # TODO' "$tap" | sed -E 's/^ *ok [0-9]+ - (.*) # TODO.*/::warning::todo test now passes, remove its todo: \1/' || true
